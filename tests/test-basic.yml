name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          owner: matrix-org
          branch: main
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          PR_ID: ${{ steps.action.outputs.pr_id }}
          HEAD_BRANCH: ${{ steps.action.outputs.head_branch }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr_id: $PR_ID"
          echo "head_branch: $HEAD_BRANCH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PR_ID" ]; then
              echo "FAIL: action succeeded but pr_id is empty"
              exit 1
            fi
            if [ "$HEAD_BRANCH" != "main" ]; then
              echo "FAIL: expected head_branch 'main'"
              exit 1
            fi
            echo "PASS: got PR $PR_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
