name: Test merge queue branch lookup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          owner: matrix-org
          branch: gh-readonly-queue/main/pr-1-abcdef0123456789
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.pr_id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr_id: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$RESULT" != "1" ]; then
              echo "FAIL: expected pr_id '1' decoded from merge-queue branch"
              exit 1
            fi
            echo "PASS: got PR '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
