name: Test PR not found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          owner: nonexistent-user-zz9q
          branch: no-such-branch-zz9q-123456
      - name: Assert action failed (no PR can exist for this branch)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_ID: ${{ steps.action.outputs.pr_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr_id: $PR_ID"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome when no PR exists"
            exit 1
          fi
          echo "PASS"
